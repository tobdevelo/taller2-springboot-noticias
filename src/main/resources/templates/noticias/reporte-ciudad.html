<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte por Ciudad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h3>Consulta Parametrizada: Noticias por Ciudad</h3>

<form th:action="@{/noticias/reporte/ciudad}" method="get" class="row g-2 my-3">
    <div class="col-auto">
        <input type="text" name="ciudad" th:value="${filtroAplicado}" class="form-control" placeholder="Ej: Cartagena, Bogotá">
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-info">Filtrar</button>
        <a th:href="@{/noticias/reporte/ciudad}" class="btn btn-outline-secondary">Limpiar</a>
        <a th:href="@{/noticias}" class="btn btn-secondary">Volver</a>
    </div>
</form>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Ciudad</th>
        <th>Departamento</th>
        <th>Categoría</th>
        <th>Periodista</th>
        <th>Programa</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="n : ${noticias}">
        <td th:text="${n.id}"></td>
        <td th:text="${n.ciudad}"></td>
        <td th:text="${n.departamento}"></td>
        <td th:text="${n.categoria}"></td>
        <td th:text="${n.periodista}"></td>
        <td th:text="${n.programaEmite}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
