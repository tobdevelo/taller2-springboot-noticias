<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Noticias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de Noticias</h2>
    <div>
        <a th:href="@{/noticias/nuevo}" class="btn btn-primary">+ Nueva Noticia</a>
        <a th:href="@{/noticias/reporte/categoria}" class="btn btn-outline-info">Reporte Categoría</a>
        <a th:href="@{/noticias/reporte/ciudad}" class="btn btn-outline-info">Reporte Ciudad</a>
        <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Gestión Usuarios</a>
        <a th:href="@{/logout}" class="btn btn-outline-danger">Cerrar Sesión</a>
    </div>
</div>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Categoría</th>
        <th>Fecha</th>
        <th>Ciudad</th>
        <th>Periodista</th>
        <th>Programa</th>
        <th>Público</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="n : ${noticias}">
        <td th:text="${n.id}"></td>
        <td th:text="${n.categoria}"></td>
        <td th:text="${n.fecha}"></td>
        <td th:text="${n.ciudad}"></td>
        <td th:text="${n.periodista}"></td>
        <td th:text="${n.programaEmite}"></td>
        <td th:text="${n.nivelPublico}"></td>
        <td>
            <a th:href="@{/noticias/editar/{id}(id=${n.id})}" class="btn btn-sm btn-warning">Editar</a>
            <a th:href="@{/noticias/eliminar/{id}(id=${n.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro de eliminar?')">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
