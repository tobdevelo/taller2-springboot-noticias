<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Noticia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h3 th:text="${noticia.id != null ? 'Editar Noticia' : 'Nueva Noticia'}"></h3>

<form th:action="@{/noticias/guardar}" th:object="${noticia}" method="post" class="row g-3 mt-2">
    <input type="hidden" th:field="*{id}">

    <div class="col-md-4">
        <label class="form-label">Categoría</label>
        <input type="text" th:field="*{categoria}" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Fecha Suceso</label>
        <input type="date" th:field="*{fecha}" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Fecha Emisión</label>
        <input type="date" th:field="*{fechaEmision}" class="form-control" required>
    </div>

    <div class="col-md-4">
        <label class="form-label">País</label>
        <input type="text" th:field="*{pais}" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Departamento</label>
        <input type="text" th:field="*{departamento}" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Ciudad</label>
        <input type="text" th:field="*{ciudad}" class="form-control" required>
    </div>

    <div class="col-md-4">
        <label class="form-label">Periodista</label>
        <input type="text" th:field="*{periodista}" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Programa que Emite</label>
        <input type="text" th:field="*{programaEmite}" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Nivel de Público</label>
        <input type="text" th:field="*{nivelPublico}" class="form-control" required>
    </div>

    <div class="col-12">
        <label class="form-label">Descripción</label>
        <textarea th:field="*{descripcion}" rows="3" class="form-control" required></textarea>
    </div>

    <div class="col-12 mt-4">
        <button type="submit" class="btn btn-success">Guardar Noticia</button>
        <a th:href="@{/noticias}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
</body>
</html>
