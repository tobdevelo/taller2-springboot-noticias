<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h3>Formulario de Usuario</h3>

<form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="row g-3 mt-2" style="max-width: 600px;">
    <div class="col-12">
        <label class="form-label">ID (Usuario / Login)</label>
        <input type="text" th:field="*{id}" class="form-control" required>
    </div>
    <div class="col-12">
        <label class="form-label">Nombre Completo</label>
        <input type="text" th:field="*{nombre}" class="form-control" required>
    </div>
    <div class="col-12">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" th:field="*{email}" class="form-control" required>
    </div>
    <div class="col-12">
        <label class="form-label">Contraseña</label>
        <input type="password" th:field="*{clave}" class="form-control" required>
    </div>
    <div class="col-12">
        <label class="form-label">Rol</label>
        <select th:field="*{rol}" class="form-select" required>
            <option value="Administrador">Administrador</option>
            <option value="Editor">Editor</option>
            <option value="Lector">Lector</option>
        </select>
    </div>

    <div class="col-12 mt-4">
        <button type="submit" class="btn btn-success">Guardar Usuario</button>
        <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
</body>
</html>
