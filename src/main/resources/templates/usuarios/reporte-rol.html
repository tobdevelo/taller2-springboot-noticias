<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Usuarios por Rol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h3>Consulta Parametrizada: Usuarios por Rol</h3>

<form th:action="@{/usuarios/reporte/rol}" method="get" class="row g-2 my-3">
    <div class="col-auto">
        <input type="text" name="rol" th:value="${filtroAplicado}" class="form-control" placeholder="Ej: Administrador">
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-info">Filtrar</button>
        <a th:href="@{/usuarios/reporte/rol}" class="btn btn-outline-secondary">Limpiar</a>
        <a th:href="@{/usuarios}" class="btn btn-secondary">Volver</a>
    </div>
</form>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Rol</th>
        <th>Email</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usuarios}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.nombre}"></td>
        <td th:text="${u.rol}"></td>
        <td th:text="${u.email}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
