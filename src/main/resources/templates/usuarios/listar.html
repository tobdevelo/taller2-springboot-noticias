<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de Usuarios</h2>
    <div>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Nuevo Usuario</a>
        <a th:href="@{/usuarios/reporte/rol}" class="btn btn-outline-info">Reporte Rol</a>
        <a th:href="@{/usuarios/reporte/nombre}" class="btn btn-outline-info">Reporte Nombre</a>
        <a th:href="@{/noticias}" class="btn btn-outline-secondary">Ir a Noticias</a>
        <a th:href="@{/logout}" class="btn btn-outline-danger">Cerrar Sesión</a>
    </div>
</div>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Rol</th>
        <th>Email</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usuarios}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.nombre}"></td>
        <td th:text="${u.rol}"></td>
        <td th:text="${u.email}"></td>
        <td>
            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-warning">Editar</a>
            <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar usuario?')">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
