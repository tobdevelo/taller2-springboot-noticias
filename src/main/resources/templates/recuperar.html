<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Clave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 shadow-sm" style="width: 400px;">
    <h3 class="text-center mb-3">Recuperación de Clave</h3>
    <div th:if="${mensaje}" class="alert alert-success p-2" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger p-2" th:text="${error}"></div>
    <form th:action="@{/recuperar}" method="post">
        <div class="mb-3">
            <label class="form-label">Correo Electrónico Registrado</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-warning w-100">Enviar Recordatorio</button>
    </form>
    <div class="text-center mt-3">
        <a th:href="@{/login}">Volver al Login</a>
    </div>
</div>
</body>
</html>
