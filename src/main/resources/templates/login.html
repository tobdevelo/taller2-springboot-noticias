<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 shadow-sm" style="width: 380px;">
    <h3 class="text-center mb-3">Acceso al Sistema</h3>
    <div th:if="${error}" class="alert alert-danger p-2" th:text="${error}"></div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Identificador (ID)</label>
            <input type="text" name="id" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="clave" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
    <div class="text-center mt-3">
        <a th:href="@{/recuperar}">¿Olvidó su clave?</a>
    </div>
</div>
</body>
</html>
